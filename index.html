<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Word Scramble Game</title>
</head>
<body>
    <h1>Word Scramble</h1>
    <div id="content-box">
        <div id="word-container"></div>
        <h2 id="hint">Hint:</h2>
        <h2 id="time-left">Time left:</h2>
        <h2 id="point">Point:</h2>
        <input type="text" name="word" id="answer-field" placeholder="Enter a valid answer">
            <div class="btn-container">
            <button id="refresh-btn">Refresh Word</button>
            <button id="check-btn">Check Word</button>
            <button id="start-btn">Start</button>
            </div>
    </div>
    <div id="result-box" class=" box hidden">
        <div id="result-content">
            <h2 id="game-over">🎮 Game over 🎮</h2>
            <p>Your final score is <span id="final-score">0</span></p>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
